<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 262 755 322" width="900" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Clients reach a Kubernetes service load balancer, which fronts a Triton inference server deployment of several pods. DCGM exporter reads GPU utilisation from the pods and feeds Prometheus, the Prometheus adapter and the Kubernetes custom metrics API, which the HorizontalPodAutoscaler queries to scale the deployment.">
