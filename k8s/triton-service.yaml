apiVersion: v1
kind: Service
metadata:
  name: triton-service
  labels:
    app: triton-inference-server
spec:
  type: NodePort
  selector:
    app: triton-inference-server
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
      nodePort: 30001
    - name: grpc
      protocol: TCP
      port: 8001
      targetPort: grpc
      nodePort: 30002
    - name: metrics
      protocol: TCP
      port: 8002
      targetPort: metrics
      nodePort: 30003
