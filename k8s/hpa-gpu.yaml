apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: triton-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: triton-inference-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # DCGM_FI_DEV_GPU_UTIL is a percentage (0-100) reported per physical GPU.
    # The Service name is fixed by installing the chart as `dcgm-exporter`,
    # so this file needs no editing.
    - type: Object
      object:
        metric:
          name: DCGM_FI_DEV_GPU_UTIL
        describedObject:
          apiVersion: v1
          kind: Service
          name: dcgm-exporter
        target:
          type: Value
          value: "30"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
